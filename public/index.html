<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recruitment Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      //for the dark mode and custom color to be applied
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                light: "#4f46e5", //indigo 600
                dark: "#6366f1",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-slate-500 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300"
  >
    <nav class="">
      <div class="">
        <div class="">
          <svg
            class="w-8 h-8 text-brand-light dark:text-brand-dark"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            />
          </svg>
          <span class=""></span>
        </div>

        <div class="">
          <button class="">
            <svg
              id="sunIcon"
              class="w-5 h-5 text-amber-500 hidden"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <svg
              id="moonIcon"
              class="w-5 h-5 text-slate-700 dark:text-slate-300"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              />
            </svg>
          </button>
        </div>
      </div>
    </nav>
    <main class="">
      <header class="">
        <div class=""></div>
        <div class="">
          <span class="">System Dashboard</span>
          <h1 class="">Candidate Recruitment Management Engine</h1>
          <p class="">Perform cloud based operations</p>
        </div>
      </header>

      <section class="">
        <div class="">
          <select name="" id="" class="">
            <option value="" class="">All Technical Skills</option>
          </select>
          <span class="">Total Records: 0</span>
        </div>

        <button class="">
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>
          Add New Candidate
        </button>
      </section>

      <section class="">
        <div class="">
          <table class="">
            <thead>
              <tr class="">
                <th class="">Candidate Details</th>
                <th class="">Github Context</th>
                <th class="">Tech Stack Tags</th>
                <th class="">Pipeline Status</th>
                <th class="">System Interventions</th>
              </tr>
            </thead>
            <tbody class=""></tbody>
          </table>
        </div>
        <div class="">
          <svg
            class="w-12 h-12 mb-3 stroke-[1.5]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"
            />
          </svg>
          <p class="text-base font-medium">
            No candidate records available matching execution filters.
          </p>
        </div>
      </section>
    </main>

    <div class="">
      <div class=""></div>
      <div class="">
        <div class="">
          <h3 class=""></h3>
          <button
            id="closeModalBtn"
            class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <form id="candidateForm" class="p-6 space-y-4">
          <input type="hidden" id="candidateId" />

          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5"
              for="name"
              >Candidate Full Name</label
            >
            <input
              type="text"
              id="name"
              required
              class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5"
              for="github"
              >GitHub Username (For Ext. Portfolio API Fetch)</label
            >
            <input
              type="text"
              id="github"
              required
              class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
              placeholder="e.g., octocat"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5"
              for="skills"
              >Tech Stack Skills (Comma-separated values)</label
            >
            <input
              type="text"
              id="skills"
              required
              class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
              placeholder="React, Node.js, Express, PostgreSQL"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5"
              for="status"
              >Pipeline Status Position</label
            >
            <select
              id="status"
              class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm cursor-pointer"
            >
              <option value="Sourced">Sourced</option>
              <option value="Interviewing">Interviewing</option>
              <option value="Offered">Offered</option>
              <option value="Rejected">Rejected</option>
            </select>
          </div>

          <div
            class="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3"
          >
            <button
              type="button"
              id="cancelModalBtn"
              class="px-4 py-2 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 font-medium text-sm rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl shadow-md transition-colors"
            >
              Commit Entry
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
